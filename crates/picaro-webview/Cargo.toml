[package]
name = "picaro-webview"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional minimal headless-Chromium Cloudflare solver (feature-gated; not built for Android/Switch targets)"

[dependencies]
chromiumoxide = { version = "0.7", features = ["tokio-runtime"], default-features = false }
futures.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[[bin]]
name = "picaro-cf-solve"
path = "src/bin/solve.rs"
