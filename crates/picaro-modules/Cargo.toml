[package]
name = "picaro-modules"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Built-in service modules: Qobuz, Tidal, Deezer, YouTube, SoundCloud, Spotify, Apple, Beatport, Beatsource, Amazon, lrclib, musixmatch"

[features]
default = []
# Optional Cloudflare challenge solver used by `cf_http`. The upstream crate is
# published as `cloudscraper-rs` (there is no `cloudscraper` crate on crates.io),
# so it is aliased here to `cloudscraper`. It is OFF by default: it is heavy
# (pulls in boa_engine), requires a `browsers.json` file at runtime, and does not
# solve Cloudflare "managed" challenges in practice. Prefer PICARO_FLARESOLVERR.
cloudscraper = ["dep:cloudscraper"]

[dependencies]
picaro-core = { path = "../picaro-core" }
picaro-utils = { path = "../picaro-utils" }
picaro-downloader = { path = "../picaro-downloader" }

serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true
reqwest.workspace = true
parking_lot.workspace = true
chrono.workspace = true
regex.workspace = true
url.workspace = true
percent-encoding.workspace = true
sha1.workspace = true
sha2.workspace = true
md-5.workspace = true
hmac.workspace = true
blowfish.workspace = true
cbc.workspace = true
cipher.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
hex.workspace = true
rand.workspace = true
clap.workspace = true
log = "0.4"
once_cell = "1.20"
quick-xml.workspace = true
uuid.workspace = true
indicatif = "0.17"
futures.workspace = true
which.workspace = true
tempfile.workspace = true
# Keyless P2P source. Disabled at runtime unless PICARO_ENABLE_P2P=1.
soulseek-rs-lib = "19.1.0"
image.workspace = true
ureq = "2.10"
crc32fast = "1.4"
subprocess = "0.2"
walkdir = "2.5"
html5ever = "0.27"
markup5ever = "0.14"
# NOTE: crates.io has no `cloudscraper` package (404). The closest maintained
# crate is `cloudscraper-rs`; alias it so the import path stays `cloudscraper`.
cloudscraper = { package = "cloudscraper-rs", version = "0.2.0", optional = true }
